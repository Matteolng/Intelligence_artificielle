[server]
headless = true
port = 8501
address = "0.0.0.0"
maxUploadSize = 200
# Derrière le proxy d'Onyxia (SSP Cloud), ces protections empêchent parfois l'envoi de fichiers.
# Elles sont désactivées pour un usage interne ; réactivez-les si l'application est exposée publiquement.
enableCORS = false
enableXsrfProtection = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
# Couleur d'accent par défaut ; la couleur du bureau d'études (branding.toml / page Réglages) est injectée par CSS.
primaryColor = "#2F6B3A"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
linkColor = "#2F6B3A"
borderColor = "#D2D2D7"
showWidgetBorder = true
baseRadius = "10px"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap, sans-serif"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
